[project]
name = "shelfwalk"
version = "0.1.0"
description = "Track a toddler book want-list against Bay Area library shelves"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fonttools>=4.65.0",
    "playwright>=1.40",   # only the retired Peoria scraper needs a browser
    "pypdf>=6.19.0",
    "pypinyin>=0.55.0",
]

[dependency-groups]
# so plain `uv run pytest` resolves in-venv instead of falling back to a
# system pytest that can't import playwright
dev = ["pytest>=8"]

[tool.uv]
# Not a packaged library — just a script + its managed venv. Run with `uv run`.
package = false
